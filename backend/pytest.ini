[pytest]
pythonpath = .
testpaths = tests ml_common/tests ml_training/tests ml_service/tests
markers =
    live_rdap: allow the real domain_trust.lookup_domain_age
asyncio_default_fixture_loop_scope = function
# Third-party libraries (slowapi, pytest-asyncio, python-jose, starlette's
# test client) still call APIs that Python 3.12-3.14 deprecate. They are not
# errors and not in ScamGuard's own code; hide them so test output stays
# readable. Warnings raised from ScamGuard's own modules are still shown.
filterwarnings =
    ignore::DeprecationWarning:slowapi.*
    ignore::DeprecationWarning:pytest_asyncio.*
    ignore::DeprecationWarning:jose.*
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:passlib.*
    ignore::pytest.PytestDeprecationWarning
