version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scam_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scam_pass}
      POSTGRES_DB: ${POSTGRES_DB:-scam_detection}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scam_user}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - 5432:5432

  app_service:
    build:
      context: ./backend
      dockerfile: ../infra/docker/Dockerfile.app_service
    restart: unless-stopped
    environment:
      APP_ENV: production
      DEBUG: false
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY to a generated private secret}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-scam_user}:${POSTGRES_PASSWORD:-scam_pass}@postgres:5432/${POSTGRES_DB:-scam_detection}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost}
      ML_SERVICE_URL: http://ml_service:8002
      RATE_LIMIT_DEFAULT: 100/minute
      RATE_LIMIT_AUTH: 20/minute
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      ml_service:
        condition: service_started
    ports:
      - 8000:8000

  ml_trainer:
    build:
      context: ./backend
      dockerfile: ../infra/docker/Dockerfile.ml_trainer
    volumes:
      - ml_artifacts:/app/artifacts

  ml_service:
    build:
      context: ./backend
      dockerfile: ../infra/docker/Dockerfile.ml_service
    restart: unless-stopped
    environment:
      APP_ENV: production
      DEBUG: false
      ARTIFACTS_DIR: /app/artifacts
      PRODUCTION_MODEL_NAME: ${PRODUCTION_MODEL_NAME:-naive_bayes}
      RATE_LIMIT_DEFAULT: 200/minute
      RATE_LIMIT_PREDICT: 60/minute
      LOG_LEVEL: INFO
    volumes:
      - ml_artifacts:/app/artifacts:ro
    depends_on:
      ml_trainer:
        condition: service_completed_successfully
    ports:
      - 8002:8002

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/docker/Dockerfile.frontend
    restart: unless-stopped
    environment:
      APP_SERVICE_URL: http://app_service:8000
      PORT: 3000
    depends_on:
      - app_service
      - ml_service
    ports:
      - 3000:3000

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - app_service
      - ml_service
    ports:
      - 80:80

volumes:
  postgres_data:
  ml_artifacts:
