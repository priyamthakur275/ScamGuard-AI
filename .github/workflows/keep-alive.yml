name: Keep frontend and backend warm

# Render's free tier spins the app_service container down after 15 minutes
# of inactivity, which is what causes the "Cloud backend is waking from
# standby" delay users see on first login of the day. This workflow pings
# the real health endpoint often enough that Render never sees 15 idle
# minutes, so the delay never happens in the first place.
#
# This costs nothing extra: GitHub Actions on a public repo is free, and a
# GET to /api/v1/health does no DB writes and no ML inference.

# GitHub runs scheduled workflows on a best-effort basis (in practice every
# few hours, not every 10 minutes), so this is only the *wake-up call*: once
# the backend is up it keeps itself and the frontend awake from 08:00 to
# 22:00 IST (app_service/services/keep_alive.py). Several morning entries
# make it likely at least one fires near the start of the day.
on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "17 2 * * *"   # 07:47 IST
    - cron: "37 2 * * *"   # 08:07 IST
    - cron: "7 3 * * *"    # 08:37 IST
    - cron: "47 3 * * *"   # 09:17 IST
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping frontend and backend
        run: |
          # One request through the live frontend's /backend-api proxy wakes
          # both Render services (the Next.js frontend and the FastAPI backend).
          url="https://scamguard-frontend-r6t7.onrender.com/backend-api/api/v1/health"
          status=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 90 "$url" || echo "000")
          echo "HTTP $status"
          cat /tmp/health.json 2>/dev/null || true
          if [ "$status" != "200" ]; then
            echo "::warning::Health check through the frontend did not return 200 (got $status)."
          fi
