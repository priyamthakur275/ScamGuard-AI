# Nginx reverse proxy for the self-hosted docker-compose deployment.
#
# Note: this duplicates, for a non-Next.js entry point, the same job
# next.config.js's rewrites() already does for local dev and Vercel --
# keep the /backend-api/ prefix consistent with that file if it changes.
# ml_service is not proxied here: it's internal-only, called by
# app_service server-to-server, never directly by the browser.

upstream frontend_upstream {
    server frontend:3000;
}

upstream app_service_upstream {
    server app_service:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /backend-api/ {
        rewrite ^/backend-api/(.*)$ /$1 break;
        proxy_pass http://app_service_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
