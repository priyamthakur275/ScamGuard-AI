# The live ScamGuard deployment on Render (free plan, Oregon):
#   ScamGuard-AI        backend API  -> https://scamguard-ai-ecnj.onrender.com
#   scamguard-frontend  Next.js app  -> https://scamguard-frontend-r6t7.onrender.com
# The frontend proxies /backend-api/* to the backend (frontend/next.config.js),
# so the browser only ever talks to the frontend's origin.
#
# Both deploy from main only after GitHub CI checks pass, so a commit that
# fails Backend CI or Frontend CI never replaces the running version.
#
# The database is an external Postgres: DATABASE_URL is set on the backend in
# the Render dashboard and is not kept in this file.
services:
  - type: web
    name: ScamGuard-AI
    runtime: docker
    region: oregon
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: infra/docker/Dockerfile.app_service
    dockerContext: .
    envVars:
      - key: APP_ENV
        value: "production"
      - key: DEBUG
        value: "false"
      # One worker fits the free instance's 512 MB (~250 MB per worker).
      - key: UVICORN_WORKERS
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: scamguard-frontend
    runtime: node
    region: oregon
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: APP_SERVICE_URL
        value: "https://scamguard-ai-ecnj.onrender.com"
