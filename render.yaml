# The live ScamGuard deployment on Render (free plan, Oregon):
#   ScamGuard-AI        backend API  -> https://scamguard-ai-ecnj.onrender.com
# The Next.js frontend is hosted on Vercel (free Hobby plan, never sleeps) and
# proxies /backend-api/* to this backend (frontend/next.config.js), so the
# browser only ever talks to the frontend's origin. Keeping the frontend off
# Render leaves the backend all 750 free instance-hours, so it stays awake 24/7.
#
# Both deploy from main only after GitHub CI checks pass, so a commit that
# fails Backend CI or Frontend CI never replaces the running version.
#
# The database is an external Postgres on Neon (free, never expires): DATABASE_URL is set on the backend in
# the Render dashboard and is not kept in this file.
services:
  - type: web
    name: ScamGuard-AI
    runtime: docker
    region: oregon
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: infra/docker/Dockerfile.app_service
    dockerContext: .
    envVars:
      - key: APP_ENV
        value: "production"
      - key: DEBUG
        value: "false"
      # One worker fits the free instance's 512 MB (~250 MB per worker).
      - key: UVICORN_WORKERS
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
