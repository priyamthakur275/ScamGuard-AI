# Render deployment of the ScamGuard back end (FastAPI, Docker).
# The Next.js front end proxies /backend-api/* to this service (frontend/next.config.js),
# so the browser only talks to the front end's origin.
# Deploys from main only after the GitHub CI checks pass.
# DATABASE_URL is set in the Render dashboard and is not kept in this file.
services:
  - type: web
    name: ScamGuard-AI
    runtime: docker
    region: oregon
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /api/v1/health
    dockerfilePath: infra/docker/Dockerfile.app_service
    dockerContext: .
    envVars:
      - key: APP_ENV
        value: "production"
      - key: DEBUG
        value: "false"
      # One worker fits the free instance's 512 MB (~250 MB per worker).
      - key: UVICORN_WORKERS
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
